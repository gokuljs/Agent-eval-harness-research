[project]
name = "agent-improvement-loop"
version = "0.1.0"
description = "Agent traces, feedback, evals, and a HALO handoff for Codex."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "halo-engine==0.3.5",
    "ipykernel==7.4.0",
    "ipython==9.18.1",
    "jupyter-client==8.10.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "openai==2.32.0",
    "openai-agents==0.14.7",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false
cache-dir = ".local/uv-cache"
